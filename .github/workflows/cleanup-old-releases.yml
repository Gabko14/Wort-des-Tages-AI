name: Cleanup Old Release Assets

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to delete release assets

    steps:
      - name: Delete assets from releases older than 6 months
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sixMonthsAgo = new Date();
            sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);

            console.log(`Deleting assets from releases created before: ${sixMonthsAgo.toISOString()}`);

            // Get all releases (paginated)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let totalDeleted = 0;
            let releasesProcessed = 0;

            for (const release of releases) {
              const releaseDate = new Date(release.created_at);

              if (releaseDate < sixMonthsAgo) {
                releasesProcessed++;
                console.log(`\nProcessing release: ${release.tag_name} (${release.created_at})`);

                if (release.assets && release.assets.length > 0) {
                  for (const asset of release.assets) {
                    console.log(`  Deleting asset: ${asset.name} (${(asset.size / 1024 / 1024).toFixed(2)} MB)`);

                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });

                    totalDeleted++;
                  }
                } else {
                  console.log(`  No assets to delete`);
                }
              }
            }

            console.log(`\n--- Summary ---`);
            console.log(`Releases processed: ${releasesProcessed}`);
            console.log(`Assets deleted: ${totalDeleted}`);
