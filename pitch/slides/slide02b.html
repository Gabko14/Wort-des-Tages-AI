<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F7F7;
  font-family: Arial, sans-serif;
  display: flex;
}
.nav-bar {
  width: 50pt;
  background: #0D1B2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15pt;
}
.nav-bar img {
  width: 30pt;
  height: 30pt;
}
.main {
  flex: 1;
  padding: 20pt 30pt 45pt 30pt;
  display: flex;
  flex-direction: column;
}
.title-row {
  display: flex;
  align-items: center;
  margin-bottom: 15pt;
}
.title-icon {
  width: 42pt;
  height: 42pt;
  background: #3A86FF;
  border-radius: 6pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15pt;
}
.title-icon p {
  color: #F7F7F7;
  font-size: 22pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  font-size: 32pt;
  color: #0D1B2A;
  margin: 0;
  font-weight: bold;
}
.screenshot-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.phone-mockup {
  width: 140pt;
  height: 260pt;
  background: #0D1B2A;
  border-radius: 14pt;
  border: 4pt solid #3A86FF;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.phone-mockup img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.page-number {
  position: absolute;
  bottom: 8pt;
  left: 0; right: 0; text-align: center;
  font-size: 12pt;
  color: #1B3A4B;
}
</style>
</head>
<body>
<div class="nav-bar">
  <img src="../assets/logo.png" />
</div>
<div class="main">
  <div class="title-row">
    <div class="title-icon"><p>+</p></div>
    <h1>Unsere Loesung</h1>
  </div>
  <div class="screenshot-container">
    <div class="phone-mockup">
      <img src="../../docs/screenshots/homescreen-premium.png" />
    </div>
  </div>
</div>
<p class="page-number">3</p>
</body>
</html>
