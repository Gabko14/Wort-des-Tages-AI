<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F7F7;
  font-family: Arial, sans-serif;
  display: flex;
}
.nav-bar {
  width: 50pt;
  background: #0D1B2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15pt;
}
.nav-bar img {
  width: 30pt;
  height: 30pt;
}
.main {
  flex: 1;
  padding: 20pt 32pt 45pt 32pt;
}
.title-row {
  display: flex;
  align-items: center;
  margin-bottom: 12pt;
}
.title-icon {
  width: 42pt;
  height: 42pt;
  background: #FFBE0B;
  border-radius: 6pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15pt;
}
.title-icon p {
  color: #0D1B2A;
  font-size: 20pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  font-size: 32pt;
  color: #0D1B2A;
  margin: 0;
  font-weight: bold;
}
.table-container {
  background: #ffffff;
  border-radius: 6pt;
  overflow: hidden;
  margin-bottom: 12pt;
}
.table-header {
  display: flex;
  background: #0D1B2A;
  padding: 8pt 12pt;
}
.table-header p {
  flex: 1;
  font-size: 18pt;
  font-weight: bold;
  color: #F7F7F7;
  margin: 0;
  text-align: center;
}
.table-row {
  display: flex;
  padding: 7pt 12pt;
  border-bottom: 1pt solid #F7F7F7;
}
.table-row.highlight {
  background: #3A86FF;
}
.table-row.highlight p {
  color: #F7F7F7;
  font-weight: bold;
}
.table-row p {
  flex: 1;
  font-size: 18pt;
  color: #1A1A1A;
  margin: 0;
  text-align: center;
}
.kpi-grid {
  display: flex;
  gap: 14pt;
}
.kpi-card {
  flex: 1;
  background: #ffffff;
  padding: 12pt;
  border-radius: 6pt;
  text-align: center;
  border-left: 4pt solid #3A86FF;
}
.kpi-label {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0 0 4pt 0;
  text-transform: uppercase;
  font-weight: bold;
}
.kpi-value {
  font-size: 24pt;
  font-weight: bold;
  color: #0D1B2A;
  margin: 0;
}
.kpi-card.gold {
  border-left-color: #FFBE0B;
}
.kpi-card.gold .kpi-value {
  color: #FFBE0B;
}
.page-number {
  position: absolute;
  bottom: 8pt;
  left: 0; right: 0; text-align: center;
  font-size: 12pt;
  color: #1B3A4B;
}
</style>
</head>
<body>
<div class="nav-bar">
  <img src="../assets/logo.png" />
</div>
<div class="main">
  <div class="title-row">
    <div class="title-icon"><p>%</p></div>
    <h1>Finanzen</h1>
  </div>
  <div class="table-container">
    <div class="table-header">
      <p>Jahr</p>
      <p>Nutzer</p>
      <p>Premium-Anteil</p>
      <p>Einnahmen</p>
    </div>
    <div class="table-row">
      <p>2025</p>
      <p>10'000</p>
      <p>10%</p>
      <p>25k CHF</p>
    </div>
    <div class="table-row highlight">
      <p>2026</p>
      <p>25'000</p>
      <p>15%</p>
      <p>94k CHF</p>
    </div>
    <div class="table-row">
      <p>2027</p>
      <p>50'000</p>
      <p>20%</p>
      <p>300k CHF</p>
    </div>
    <div class="table-row">
      <p>2029</p>
      <p>100'000</p>
      <p>30%</p>
      <p>1.05M CHF</p>
    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card gold">
      <p class="kpi-label">Break-even</p>
      <p class="kpi-value">2026</p>
    </div>
    <div class="kpi-card">
      <p class="kpi-label">Startliquiditaet</p>
      <p class="kpi-value">60k CHF</p>
    </div>
    <div class="kpi-card">
      <p class="kpi-label">Laufende Kosten</p>
      <p class="kpi-value">&lt;100 CHF/Mt</p>
    </div>
  </div>
</div>
<p class="page-number">9</p>
</body>
</html>
