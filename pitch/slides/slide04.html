<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F7F7;
  font-family: Arial, sans-serif;
  display: flex;
}
.nav-bar {
  width: 50pt;
  background: #0D1B2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15pt;
}
.nav-bar img {
  width: 30pt;
  height: 30pt;
}
.main {
  flex: 1;
  padding: 22pt 32pt 45pt 32pt;
}
.title-row {
  display: flex;
  align-items: center;
  margin-bottom: 16pt;
}
.title-icon {
  width: 42pt;
  height: 42pt;
  background: #FFBE0B;
  border-radius: 6pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15pt;
}
.title-icon p {
  color: #0D1B2A;
  font-size: 20pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  font-size: 32pt;
  color: #0D1B2A;
  margin: 0;
  font-weight: bold;
}
.market-grid {
  display: flex;
  gap: 14pt;
  margin-bottom: 6pt;
}
.market-card {
  flex: 1;
  background: #ffffff;
  padding: 12pt 12pt;
  border-radius: 6pt;
  text-align: center;
  border-bottom: 4pt solid #3A86FF;
}
.market-year {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0 0 6pt 0;
  text-transform: uppercase;
  font-weight: bold;
}
.market-value {
  font-size: 32pt;
  font-weight: bold;
  color: #0D1B2A;
  margin: 0 0 4pt 0;
}
.market-label {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0;
}
.source-note {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0 0 8pt 0;
  font-style: italic;
  text-align: right;
}
.strategy-section {
  background: #0D1B2A;
  padding: 10pt 18pt;
  border-radius: 6pt;
  border-left: 4pt solid #FFBE0B;
}
.strategy-title {
  font-size: 18pt;
  font-weight: bold;
  color: #FFBE0B;
  margin: 0 0 10pt 0;
}
.strategy-grid {
  display: flex;
  gap: 10pt;
}
.strategy-item {
  flex: 1;
  background: #1B3A4B;
  padding: 6pt 8pt;
  border-radius: 4pt;
}
.strategy-item p {
  font-size: 18pt;
  color: #F7F7F7;
  margin: 0;
  text-align: center;
}
.page-number {
  position: absolute;
  bottom: 8pt;
  left: 0; right: 0; text-align: center;
  font-size: 12pt;
  color: #1B3A4B;
}
</style>
</head>
<body>
<div class="nav-bar">
  <img src="../assets/logo.png" />
</div>
<div class="main">
  <div class="title-row">
    <div class="title-icon"><p>^</p></div>
    <h1>Der Markt</h1>
  </div>
  <div class="market-grid">
    <div class="market-card">
      <p class="market-year">Jahr 1</p>
      <p class="market-value">10k</p>
      <p class="market-label">Nutzer</p>
    </div>
    <div class="market-card">
      <p class="market-year">Jahr 3</p>
      <p class="market-value">50k</p>
      <p class="market-label">Nutzer</p>
    </div>
    <div class="market-card">
      <p class="market-year">Jahr 5</p>
      <p class="market-value">100k</p>
      <p class="market-label">Nutzer</p>
    </div>
  </div>
  <p class="source-note">Quelle: Eigene Schätzung</p>
  <div class="strategy-section">
    <p class="strategy-title">Markteinführungsstrategie</p>
    <div class="strategy-grid">
      <div class="strategy-item">
        <p>App Store Launch</p>
        <p>(Android zuerst)</p>
      </div>
      <div class="strategy-item">
        <p>Social Media</p>
        <p>Marketing</p>
      </div>
      <div class="strategy-item">
        <p>Kooperationen mit</p>
        <p>Sprachschulen</p>
      </div>
      <div class="strategy-item">
        <p>Sprachcoaches</p>
        <p>& Communities</p>
      </div>
    </div>
  </div>
</div>
<p class="page-number">5</p>
</body>
</html>
