<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0D1B2A;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
}
.sidebar {
  width: 200pt;
  background: #1B3A4B;
  padding: 40pt 25pt;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-right: 4pt solid #3A86FF;
}
.sidebar img {
  width: 85pt;
  height: 85pt;
  margin-bottom: 20pt;
}
.sidebar-line {
  width: 50pt;
  height: 3pt;
  background: #FFBE0B;
  margin: 12pt 0;
}
.sidebar-text {
  font-size: 18pt;
  color: #3A86FF;
  text-align: center;
  margin: 0;
  font-weight: bold;
}
.sidebar-text-sub {
  font-size: 18pt;
  color: #F7F7F7;
  text-align: center;
  margin: 8pt 0 0 0;
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 35pt 45pt 45pt 45pt;
}
h1 {
  font-size: 40pt;
  color: #F7F7F7;
  margin: 0 0 8pt 0;
  font-weight: bold;
}
.tagline {
  font-size: 22pt;
  color: #FFBE0B;
  margin: 0 0 30pt 0;
  font-style: italic;
}
.event-card {
  background: #1B3A4B;
  padding: 18pt 24pt;
  border-radius: 6pt;
  border-left: 4pt solid #FFBE0B;
}
.event-card p {
  margin: 0;
  font-size: 18pt;
  color: #F7F7F7;
}
.event-title {
  font-weight: bold;
  color: #3A86FF;
  font-size: 20pt;
  margin-bottom: 6pt;
}
.team-info {
  margin-top: 6pt;
  color: #F7F7F7;
}
.contact-info {
  margin-top: 10pt;
  padding-top: 10pt;
  border-top: 1pt solid #3A86FF;
}
.contact-info p {
  font-size: 18pt;
  color: #F7F7F7;
  margin: 0;
}
</style>
</head>
<body>
<div class="sidebar">
  <img src="../assets/logo.png" />
  <div class="sidebar-line"></div>
  <p class="sidebar-text">Gate 2 Pitch</p>
  <p class="sidebar-text-sub">M241</p>
</div>
<div class="main">
  <h1>Wort des Tages AI</h1>
  <p class="tagline">1 Wort besser am Tag</p>
  <div class="event-card">
    <p class="event-title">Pitch-Praesentation</p>
    <p>11. Januar 2026</p>
    <p class="team-info">Gabriel, Ayan, Raphael</p>
    <div class="contact-info"><p>gabkolistiak@gmail.com</p></div>
  </div>
</div>
</body>
</html>
