<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F7F7;
  font-family: Arial, sans-serif;
  display: flex;
}
.nav-bar {
  width: 50pt;
  background: #0D1B2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15pt;
}
.nav-bar img {
  width: 30pt;
  height: 30pt;
}
.main {
  flex: 1;
  padding: 20pt 30pt 45pt 30pt;
  display: flex;
  flex-direction: column;
}
.title-row {
  display: flex;
  align-items: center;
  margin-bottom: 14pt;
}
.title-icon {
  width: 42pt;
  height: 42pt;
  background: #FFBE0B;
  border-radius: 6pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15pt;
}
.title-icon p {
  color: #0D1B2A;
  font-size: 24pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  font-size: 32pt;
  color: #0D1B2A;
  margin: 0;
  font-weight: bold;
}
.content-grid {
  display: flex;
  gap: 20pt;
  flex: 1;
}
.overview-section {
  flex: 1.3;
}
.overview-title {
  font-size: 18pt;
  font-weight: bold;
  color: #0D1B2A;
  margin: 0 0 10pt 0;
}
.slides-grid {
  display: flex;
  gap: 8pt;
}
.slides-col {
  flex: 1;
}
.slide-item {
  display: flex;
  align-items: center;
  margin-bottom: 6pt;
}
.slide-num {
  width: 20pt;
  height: 20pt;
  background: #3A86FF;
  border-radius: 4pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 8pt;
  flex-shrink: 0;
}
.slide-num p {
  font-size: 18pt;
  font-weight: bold;
  color: #F7F7F7;
  margin: 0;
}
.slide-name {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0;
}
.thanks-section {
  flex: 0.7;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.footer-text {
  font-size: 22pt;
  color: #0D1B2A;
  font-weight: bold;
  margin: 0 0 14pt 0;
}
.contact-box {
  background: #3A86FF;
  padding: 8pt 16pt;
  border-radius: 20pt;
  display: inline-block;
}
.contact {
  font-size: 18pt;
  color: #F7F7F7;
  margin: 0;
}
.page-number {
  position: absolute;
  bottom: 8pt;
  left: 0; right: 0; text-align: center;
  font-size: 12pt;
  color: #1B3A4B;
}
</style>
</head>
<body>
<div class="nav-bar">
  <img src="../assets/logo.png" />
</div>
<div class="main">
  <div class="title-row">
    <div class="title-icon"><p>?</p></div>
    <h1>Fragen & Antworten</h1>
  </div>
  <div class="content-grid">
    <div class="overview-section">
      <p class="overview-title">Folienübersicht</p>
      <div class="slides-grid">
        <div class="slides-col">
          <div class="slide-item">
            <div class="slide-num"><p>1</p></div>
            <p class="slide-name">Das Problem</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>2</p></div>
            <p class="slide-name">Unsere Lösung</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>3</p></div>
            <p class="slide-name">Warum es funktioniert</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>4</p></div>
            <p class="slide-name">Der Markt</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>5</p></div>
            <p class="slide-name">Die Mitbewerber</p>
          </div>
        </div>
        <div class="slides-col">
          <div class="slide-item">
            <div class="slide-num"><p>6</p></div>
            <p class="slide-name">Geschäftsmodell</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>7</p></div>
            <p class="slide-name">Die Umsetzung</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>8</p></div>
            <p class="slide-name">Finanzen</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>9</p></div>
            <p class="slide-name">Team</p>
          </div>
          <div class="slide-item">
            <div class="slide-num"><p>10</p></div>
            <p class="slide-name">Fazit</p>
          </div>
        </div>
      </div>
    </div>
    <div class="thanks-section">
      <p class="footer-text">Vielen Dank für Ihre Aufmerksamkeit!</p>
      <div class="contact-box"><p class="contact">gabkolistiak@gmail.com</p></div>
    </div>
  </div>
</div>
<p class="page-number">12</p>
</body>
</html>
