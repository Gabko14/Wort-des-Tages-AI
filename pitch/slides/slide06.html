<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F7F7;
  font-family: Arial, sans-serif;
  display: flex;
}
.nav-bar {
  width: 50pt;
  background: #0D1B2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15pt;
}
.nav-bar img {
  width: 30pt;
  height: 30pt;
}
.main {
  flex: 1;
  padding: 22pt 32pt 45pt 32pt;
}
.title-row {
  display: flex;
  align-items: center;
  margin-bottom: 16pt;
}
.title-icon {
  width: 42pt;
  height: 42pt;
  background: #3A86FF;
  border-radius: 6pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15pt;
}
.title-icon p {
  color: #F7F7F7;
  font-size: 20pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  font-size: 32pt;
  color: #0D1B2A;
  margin: 0;
  font-weight: bold;
}
.model-grid {
  display: flex;
  gap: 16pt;
}
.tier-card {
  flex: 1;
  background: #ffffff;
  border-radius: 6pt;
  overflow: hidden;
}
.tier-header {
  background: #1B3A4B;
  padding: 10pt 14pt;
}
.tier-header.premium {
  background: #0D1B2A;
}
.tier-name {
  font-size: 20pt;
  font-weight: bold;
  color: #F7F7F7;
  margin: 0;
}
.tier-body {
  padding: 12pt 14pt;
}
.feature-item {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0 0 6pt 0;
  padding-left: 14pt;
}
.price-card {
  flex: 0.9;
  background: #0D1B2A;
  border-radius: 6pt;
  padding: 18pt;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-left: 4pt solid #FFBE0B;
}
.price-label {
  font-size: 18pt;
  color: #3A86FF;
  margin: 0 0 8pt 0;
  text-transform: uppercase;
  font-weight: bold;
}
.price-value {
  font-size: 36pt;
  font-weight: bold;
  color: #FFBE0B;
  margin: 0 0 4pt 0;
}
.price-period {
  font-size: 18pt;
  color: #F7F7F7;
  margin: 0 0 12pt 0;
}
.price-note {
  font-size: 18pt;
  color: #F7F7F7;
  margin: 0;
  text-align: center;
}
.page-number {
  position: absolute;
  bottom: 8pt;
  left: 0; right: 0; text-align: center;
  font-size: 12pt;
  color: #1B3A4B;
}
</style>
</head>
<body>
<div class="nav-bar">
  <img src="../assets/logo.png" />
</div>
<div class="main">
  <div class="title-row">
    <div class="title-icon"><p>$</p></div>
    <h1>Geschaeftsmodell</h1>
  </div>
  <div class="model-grid">
    <div class="tier-card">
      <div class="tier-header">
        <p class="tier-name">Free</p>
      </div>
      <div class="tier-body">
        <p class="feature-item">+ Taegliche Woerter</p>
        <p class="feature-item">+ Einstellungen</p>
        <p class="feature-item">+ Benachrichtigungen</p>
        <p class="feature-item">+ Streak-Tracking</p>
      </div>
    </div>
    <div class="tier-card">
      <div class="tier-header premium">
        <p class="tier-name">Premium</p>
      </div>
      <div class="tier-body">
        <p class="feature-item">+ KI-Definitionen</p>
        <p class="feature-item">+ Interaktive Quizze</p>
        <p class="feature-item">+ Beispielsaetze</p>
        <p class="feature-item">+ Erweiterte Statistiken</p>
      </div>
    </div>
    <div class="price-card">
      <p class="price-label">Premium Preis</p>
      <p class="price-value">25</p>
      <p class="price-period">CHF / Jahr</p>
      <p class="price-note">Wiederkehrende Einnahmen</p>
    </div>
  </div>
</div>
<p class="page-number">7</p>
</body>
</html>
