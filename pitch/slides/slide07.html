<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F7F7;
  font-family: Arial, sans-serif;
  display: flex;
}
.nav-bar {
  width: 50pt;
  background: #0D1B2A;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15pt;
}
.nav-bar img {
  width: 30pt;
  height: 30pt;
}
.main {
  flex: 1;
  padding: 22pt 32pt 45pt 32pt;
}
.title-row {
  display: flex;
  align-items: center;
  margin-bottom: 16pt;
}
.title-icon {
  width: 42pt;
  height: 42pt;
  background: #3A86FF;
  border-radius: 6pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15pt;
}
.title-icon p {
  color: #F7F7F7;
  font-size: 20pt;
  font-weight: bold;
  margin: 0;
}
h1 {
  font-size: 32pt;
  color: #0D1B2A;
  margin: 0;
  font-weight: bold;
}
.timeline-grid {
  display: flex;
  gap: 18pt;
}
.done-section {
  flex: 1;
}
.next-section {
  flex: 1.2;
}
.section-header {
  background: #0D1B2A;
  padding: 10pt 14pt;
  border-radius: 6pt 6pt 0 0;
}
.section-header.done {
  background: #3A86FF;
}
.section-title {
  font-size: 18pt;
  font-weight: bold;
  color: #F7F7F7;
  margin: 0;
}
.section-body {
  background: #ffffff;
  padding: 14pt;
  border-radius: 0 0 6pt 6pt;
}
.milestone {
  display: flex;
  align-items: center;
  margin-bottom: 10pt;
}
.check-circle {
  width: 24pt;
  height: 24pt;
  background: #3A86FF;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10pt;
  flex-shrink: 0;
}
.check-circle p {
  color: #F7F7F7;
  font-size: 18pt;
  font-weight: bold;
  margin: 0;
}
.milestone-text {
  font-size: 18pt;
  color: #1A1A1A;
  margin: 0;
}
.step-item {
  display: flex;
  align-items: center;
  margin-bottom: 8pt;
}
.step-number {
  width: 22pt;
  height: 22pt;
  background: #FFBE0B;
  border-radius: 4pt;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10pt;
  flex-shrink: 0;
}
.step-number p {
  font-size: 18pt;
  font-weight: bold;
  color: #0D1B2A;
  margin: 0;
}
.step-text {
  font-size: 18pt;
  color: #1B3A4B;
  margin: 0;
}
.page-number {
  position: absolute;
  bottom: 8pt;
  left: 0; right: 0; text-align: center;
  font-size: 12pt;
  color: #1B3A4B;
}
</style>
</head>
<body>
<div class="nav-bar">
  <img src="../assets/logo.png" />
</div>
<div class="main">
  <div class="title-row">
    <div class="title-icon"><p>&gt;</p></div>
    <h1>Die Umsetzung</h1>
  </div>
  <div class="timeline-grid">
    <div class="done-section">
      <div class="section-header done">
        <p class="section-title">Erreicht</p>
      </div>
      <div class="section-body">
        <div class="milestone">
          <div class="check-circle"><p>+</p></div>
          <p class="milestone-text">Environment Setup</p>
        </div>
        <div class="milestone">
          <div class="check-circle"><p>+</p></div>
          <p class="milestone-text">Grundfunktionen</p>
        </div>
      </div>
    </div>
    <div class="next-section">
      <div class="section-header">
        <p class="section-title">Naechste Schritte</p>
      </div>
      <div class="section-body">
        <div class="step-item">
          <div class="step-number"><p>1</p></div>
          <p class="step-text">Entwicklung abschliessen</p>
        </div>
        <div class="step-item">
          <div class="step-number"><p>2</p></div>
          <p class="step-text">KI-Integration</p>
        </div>
        <div class="step-item">
          <div class="step-number"><p>3</p></div>
          <p class="step-text">Premium und In-App Purchases</p>
        </div>
        <div class="step-item">
          <div class="step-number"><p>4</p></div>
          <p class="step-text">Beta-Testing</p>
        </div>
        <div class="step-item">
          <div class="step-number"><p>5</p></div>
          <p class="step-text">App Store Launch</p>
        </div>
      </div>
    </div>
  </div>
</div>
<p class="page-number">8</p>
</body>
</html>
